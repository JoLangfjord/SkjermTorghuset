<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infoskjerm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #182029;
    --bg-panel: #1F2933;
    --text: #F1EEE6;
    --text-dim: #A7AEB6;
    --brass: #C9A467;
    --teal: #5B8A80;
    --red: #C1666B;
    --hairline: rgba(241,238,230,0.14);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    padding: 3.2vh 4vw 3vh 4vw;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom: 2.2vh;
    border-bottom: 1px solid var(--hairline);
    flex-shrink:0;
  }
  .sameie-navn{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 2.6vw, 2.6rem);
    letter-spacing: 0.01em;
  }
  .klokke-wrap{
    display:flex;
    align-items:baseline;
    gap: 1.4vw;
    font-variant-numeric: tabular-nums;
  }
  .klokke{ font-size: clamp(1.6rem, 2.8vw, 2.8rem); font-weight: 600; }
  .dato{ font-size: clamp(0.95rem, 1.3vw, 1.3rem); color: var(--text-dim); text-transform: capitalize; }

  main{
    flex: 1;
    position: relative;
    display:flex;
    align-items:center;
    min-height:0;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    opacity:0;
    transform: translateY(10px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    pointer-events:none;
    overflow:hidden;
  }
  .slide.aktiv{ opacity:1; transform: translateY(0); pointer-events:auto; }
  .slide.melding{ align-items:flex-start; padding-top: 2vh; }
  .slide.melding .tekst-kolonne{ max-height: 100%; overflow:hidden; }

  /* ---- Meldinger ---- */
  .slide.melding{ max-width: 74%; }
  .slide.melding.med-bilde{ max-width: 90%; gap: 4.5vw; }
  .tekst-kolonne{ display:flex; flex-direction:column; justify-content:center; }
  .slide.melding.med-bilde .tekst-kolonne{ flex: 0 0 42%; }
  .bilde-kolonne{ flex:1; height:62vh; border-radius:14px; overflow:hidden; border:1px solid var(--hairline); background:var(--bg-panel); }
  .bilde-kolonne img{ width:100%; height:100%; object-fit:cover; display:block; }
  .slide.melding.kun-bilde{ flex-direction:column; justify-content:center; max-width:74%; gap:2vh; }
  .slide.melding.kun-bilde .bilde-kolonne{ flex:none; width:100%; height:68vh; }
  .tag{
    display:inline-flex; align-items:center; align-self:flex-start;
    padding: 0.4em 0.9em; border-radius: 999px;
    font-size: clamp(0.85rem, 1vw, 1.05rem); font-weight:600;
    margin-bottom: 2.2vh;
    background: rgba(201,164,103,0.16); color: var(--brass);
  }
  .tag.viktig{ background: rgba(193,102,107,0.18); color: var(--red); }
  .tag.arrangement{ background: rgba(91,138,128,0.2); color: var(--teal); }
  .slide.melding h2{
    font-family:'Fraunces', serif; font-weight:500;
    font-size: clamp(2rem, 3.8vw, 3.8rem); line-height:1.1; margin:0 0 1.8vh 0;
  }
  .slide.melding p{
    font-size: clamp(1rem, 1.45vw, 1.45rem); line-height:1.45; color:var(--text-dim); margin:0; max-width:62ch;
  }
  .dato-chip{ margin-top:2.4vh; font-size: clamp(0.95rem, 1.15vw, 1.2rem); color:var(--brass); font-weight:500; }
  .tom{ font-size: clamp(1.3rem, 2vw, 2rem); color:var(--text-dim); font-family:'Fraunces', serif; }

  /* ---- Avganger ---- */
  .slide.avganger-slide{ max-width:100%; width:100%; flex-direction:column; justify-content:center; align-items:stretch; }
  .avganger-tittel{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(1.6rem,2.6vw,2.6rem); margin-bottom:2.2vh; }
  .avganger-grid{ display:grid; grid-template-columns:1fr 1fr; gap:5vw; }
  .av-kolonne + .av-kolonne{ border-left:1px solid var(--hairline); padding-left:5vw; }
  .av-kolonne-tittel{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(1.2rem,1.8vw,1.8rem); margin-bottom:1.4vh; }
  .av-rad{ display:flex; align-items:center; gap:1.1em; padding:1.2vh 0; border-bottom:1px solid var(--hairline); }
  .av-rad:last-child{ border-bottom:none; }
  .av-linje{
    flex-shrink:0; min-width:2.6em; text-align:center; padding:0.35em 0.6em; border-radius:8px;
    font-weight:700; font-size:clamp(0.9rem,1.2vw,1.2rem);
    background: rgba(201,164,103,0.16); color:var(--brass);
  }
  .av-kolonne.buss .av-linje{ background: rgba(91,138,128,0.2); color:var(--teal); }
  .av-dest{ flex:1; font-size:clamp(0.95rem,1.4vw,1.4rem); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .av-tid{ flex-shrink:0; text-align:right; }
  .av-tid .om{ font-size:clamp(0.95rem,1.4vw,1.4rem); font-weight:600; }
  .av-tid .kl{ display:block; font-size:clamp(0.75rem,0.95vw,0.95rem); color:var(--text-dim); }
  .av-tom, .av-feil{ color:var(--text-dim); font-size:clamp(0.95rem,1.2vw,1.2rem); }
  .av-feil{ color:var(--red); }
  .av-status{ margin-top:2vh; font-size:clamp(0.75rem,0.9vw,0.9rem); color:var(--text-dim); }

  /* ---- Vær ---- */
  .slide.vaer-slide{ max-width:100%; width:100%; }
  .vaer-hoved{ display:flex; align-items:center; gap:4vw; }
  .vaer-ikon{ flex-shrink:0; width:clamp(6rem,10vw,10rem); height:clamp(6rem,10vw,10rem); }
  .vaer-naa .sted{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(1.3rem,1.9vw,1.9rem); margin-bottom:0.6vh; color:var(--text-dim); }
  .vaer-naa .temp{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(3.5rem,6.5vw,6.5rem); line-height:1; }
  .vaer-naa .beskrivelse{ font-size:clamp(1.1rem,1.6vw,1.6rem); color:var(--text-dim); margin-top:0.8vh; }
  .vaer-detaljer{ margin-top:1vh; font-size:clamp(0.95rem,1.2vw,1.2rem); color:var(--text-dim); display:flex; gap:2em; }
  .vaer-strip{ display:flex; gap: 3vw; margin-top:5vh; padding-top:3vh; border-top:1px solid var(--hairline); }
  .vaer-time{ display:flex; flex-direction:column; align-items:center; gap:0.6vh; }
  .vaer-time .kl{ font-size:clamp(0.85rem,1.05vw,1.05rem); color:var(--text-dim); }
  .vaer-time svg{ width:clamp(2.2rem,3.4vw,3.4rem); height:clamp(2.2rem,3.4vw,3.4rem); }
  .vaer-time .t{ font-weight:600; font-size:clamp(1rem,1.3vw,1.3rem); }
  .vaer-feil{ color:var(--red); font-size:clamp(0.95rem,1.2vw,1.2rem); }

  footer{ flex-shrink:0; display:flex; justify-content:center; gap:0.6em; padding-top:2vh; }
  .prikk{ width:8px; height:8px; border-radius:50%; background:var(--hairline); transition:background 0.4s ease; }
  .prikk.aktiv{ background:var(--brass); }
</style>
</head>
<body>

<header>
  <div class="sameie-navn" id="sameieNavn">Infoskjerm</div>
  <div class="klokke-wrap">
    <div class="klokke" id="klokke">--:--</div>
    <div class="dato" id="dato">–</div>
  </div>
</header>

<main id="main">
  <!-- Meldinger-slides settes inn her av JS -->

  <div class="slide avganger-slide" data-varighet="16">
    <div style="width:100%;">
      <div class="avganger-tittel">Neste avganger · Jessheim stasjon</div>
      <div class="avganger-grid">
        <div class="av-kolonne tog">
          <div class="av-kolonne-tittel">Tog</div>
          <div id="togListe"></div>
        </div>
        <div class="av-kolonne buss">
          <div class="av-kolonne-tittel">Buss</div>
          <div id="bussListe"></div>
        </div>
      </div>
      <div class="av-status" id="avgangerStatus">Henter avganger …</div>
    </div>
  </div>

  <div class="slide vaer-slide" data-varighet="14">
    <div style="width:100%;">
      <div class="vaer-hoved">
        <div class="vaer-ikon" id="vaerIkon"></div>
        <div class="vaer-naa">
          <div class="sted" id="vaerSted">Gotaasalléen 17, Jessheim</div>
          <div class="temp" id="vaerTemp">–°</div>
          <div class="beskrivelse" id="vaerBeskrivelse">Henter værdata …</div>
          <div class="vaer-detaljer" id="vaerDetaljer"></div>
        </div>
      </div>
      <div class="vaer-strip" id="vaerStrip"></div>
    </div>
  </div>
</main>

<footer id="prikker"></footer>

<script>
  /* ============ Feilbanner (synlig på skjermen hvis noe krasjer) ============ */
  window.onerror = function(msg, src, line, col, err){
    try{
      var banner = document.getElementById('jsFeilBanner');
      if(!banner){
        banner = document.createElement('div');
        banner.id = 'jsFeilBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#C1666B;color:#fff;font-family:sans-serif;font-size:14px;padding:8px 14px;z-index:9999;';
        document.body.appendChild(banner);
      }
      banner.textContent = 'JS-feil (linje ' + line + '): ' + msg;
    }catch(e){}
    return false;
  };

  /* ============ Felles innstillinger ============ */
  var VIS_SEKUNDER_STANDARD = 12;
  var RELOAD_KL_TIME = 4;

  var mainEl = document.getElementById('main');
  var prikkerEl = document.getElementById('prikker');
  var sameieNavnEl = document.getElementById('sameieNavn');

  function get(obj, path, fallback){
    try{
      var parts = path.split('.');
      var cur = obj;
      for(var i=0;i<parts.length;i++){
        if(cur === null || cur === undefined) return fallback;
        cur = cur[parts[i]];
      }
      return (cur === undefined || cur === null) ? fallback : cur;
    }catch(e){ return fallback; }
  }

  /* ============ 1) MELDINGER (data.json) ============ */
  var OPPDATER_DATA_MIN = 5;
  var meldinger = [];

  function tagKlasse(type){
    if(type === 'viktig') return 'tag viktig';
    if(type === 'arrangement') return 'tag arrangement';
    return 'tag';
  }
  function tagTekst(type){
    if(type === 'viktig') return 'Viktig';
    if(type === 'arrangement') return 'Arrangement';
    return 'Info';
  }

  function byggMeldingSlide(m){
    var harBilde = !!m.bilde;
    var harTekst = !!(m.tekst && m.tekst.replace(/^\s+|\s+$/g, ''));
    var slide = document.createElement('div');
    slide.className = 'slide melding';
    slide.setAttribute('data-varighet', VIS_SEKUNDER_STANDARD);
    if(harBilde) slide.className += ' med-bilde';
    if(harBilde && !harTekst) slide.className += ' kun-bilde';

    var tekstDel = ''
      + '<div class="tekst-kolonne">'
      + '<div class="' + tagKlasse(m.type) + '">' + tagTekst(m.type) + '</div>'
      + '<h2>' + (m.tittel || '') + '</h2>'
      + (harTekst ? ('<p>' + m.tekst.replace(/\n/g, '<br>') + '</p>') : '')
      + (m.dato ? ('<div class="dato-chip">' + m.dato + '</div>') : '')
      + '</div>';
    var bildeDel = harBilde
      ? ('<div class="bilde-kolonne"><img src="' + m.bilde + '" alt="" onerror="this.parentElement.style.display=\'none\'"></div>')
      : '';
    slide.innerHTML = tekstDel + bildeDel;
    return slide;
  }

  function byggMeldingSlides(){
    var gamle = mainEl.querySelectorAll('.slide.melding');
    for(var i=0; i<gamle.length; i++){ gamle[i].parentNode.removeChild(gamle[i]); }

    var liste = meldinger.length > 0 ? meldinger : [{ _tom: true }];
    for(var j=0; j<liste.length; j++){
      var m = liste[j];
      var slide;
      if(m._tom){
        slide = document.createElement('div');
        slide.className = 'slide melding';
        slide.setAttribute('data-varighet', VIS_SEKUNDER_STANDARD);
        slide.innerHTML = '<div class="tekst-kolonne"><div class="tom">Ingen meldinger lagt inn ennå.</div></div>';
      } else {
        slide = byggMeldingSlide(m);
      }
      mainEl.appendChild(slide);
    }

    mainEl.appendChild(document.querySelector('.avganger-slide'));
    mainEl.appendChild(document.querySelector('.vaer-slide'));

    byggPrikker();
    startKarusell();
  }

  function hentMeldinger(){
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.sameie) sameieNavnEl.textContent = data.sameie;
        var nye = Array.isArray(data.meldinger) ? data.meldinger : [];
        if(JSON.stringify(nye) !== JSON.stringify(meldinger)){
          meldinger = nye;
          byggMeldingSlides();
        }
      })
      .catch(function(e){ console.error('Klarte ikke hente data.json', e); });
  }

  /* ============ 2) AVGANGER (Entur) ============ */
  var STOPPESTED_IDER = [
    'NSR:StopPlace:344',
    'NSR:StopPlace:4961'
  ];
  var ET_CLIENT_NAME  = 'torghuset-infoskjerm';
  var ANTALL_HENTES   = 60;
  var MAKS_PER_KOLONNE = 6;
  var OPPDATER_AVGANGER_SEK = 30;
  var ENTUR_ENDEPUNKT = 'https://api.entur.io/journey-planner/v3/graphql';
  var ENTUR_SPORRING = [
    'query($id: String!, $n: Int!) {',
    '  stopPlace(id: $id) {',
    '    name',
    '    estimatedCalls(numberOfDepartures: $n) {',
    '      expectedDepartureTime',
    '      destinationDisplay { frontText }',
    '      serviceJourney { journeyPattern { line { publicCode transportMode } } }',
    '    }',
    '  }',
    '}'
  ].join('\n');

  function minutterTil(iso){ return Math.round((new Date(iso) - new Date()) / 60000); }
  function klokkeslett(iso){ return new Date(iso).toLocaleTimeString('nb-NO', { hour:'2-digit', minute:'2-digit' }); }

  function avgangRadHtml(call){
    var linje = get(call, 'serviceJourney.journeyPattern.line.publicCode', '?');
    var dest = get(call, 'destinationDisplay.frontText', '');
    var min = minutterTil(call.expectedDepartureTime);
    var omTekst = min <= 0 ? 'Nå' : ('om ' + min + ' min');
    return ''
      + '<div class="av-rad">'
      + '<div class="av-linje">' + linje + '</div>'
      + '<div class="av-dest">' + dest + '</div>'
      + '<div class="av-tid"><span class="om">' + omTekst + '</span><span class="kl">' + klokkeslett(call.expectedDepartureTime) + '</span></div>'
      + '</div>';
  }
  function tegnAvgangKolonne(container, calls, tomTekst){
    if(calls.length === 0){ container.innerHTML = '<div class="av-tom">' + tomTekst + '</div>'; return; }
    var html = '';
    for(var i=0; i<Math.min(calls.length, MAKS_PER_KOLONNE); i++){ html += avgangRadHtml(calls[i]); }
    container.innerHTML = html;
  }

  function hentAvganger(){
    var statusEl = document.getElementById('avgangerStatus');
    var kall = [];
    for(var i=0; i<STOPPESTED_IDER.length; i++){
      kall.push(
        fetch(ENTUR_ENDEPUNKT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ET-Client-Name': ET_CLIENT_NAME },
          body: JSON.stringify({ query: ENTUR_SPORRING, variables: { id: STOPPESTED_IDER[i], n: ANTALL_HENTES } })
        }).then(function(res){
          if(!res.ok) throw new Error('Entur svarte med feilkode ' + res.status);
          return res.json();
        })
      );
    }

    Promise.all(kall).then(function(svar){
      var alleCalls = [];
      for(var i=0; i<svar.length; i++){
        var json = svar[i];
        if(json.errors && json.errors.length){ throw new Error(json.errors[0].message || 'Ukjent feil fra Entur'); }
        var calls = get(json, 'data.stopPlace.estimatedCalls', []);
        alleCalls = alleCalls.concat(calls);
      }
      alleCalls.sort(function(a,b){ return new Date(a.expectedDepartureTime) - new Date(b.expectedDepartureTime); });

      var tog = [];
      var buss = [];
      for(var j=0; j<alleCalls.length; j++){
        var mode = get(alleCalls[j], 'serviceJourney.journeyPattern.line.transportMode', '');
        if(mode === 'rail') tog.push(alleCalls[j]);
        else if(mode === 'bus' || mode === 'coach') buss.push(alleCalls[j]);
      }

      tegnAvgangKolonne(document.getElementById('togListe'), tog, 'Ingen togavganger de nærmeste minuttene.');
      tegnAvgangKolonne(document.getElementById('bussListe'), buss, 'Ingen bussavganger de nærmeste minuttene.');
      statusEl.textContent = 'Sist oppdatert ' + new Date().toLocaleTimeString('nb-NO', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }).catch(function(e){
      console.error('Klarte ikke hente avganger', e);
      statusEl.innerHTML = '<span class="av-feil">Klarte ikke hente avganger: ' + e.message + '</span>';
    });
  }

  /* ============ 3) VÆR (Meteorologisk institutt / MET) ============ */
  var VAER_LAT = 60.1403392;
  var VAER_LON = 11.1742373;
  var VAER_STED_NAVN = 'Gotaasalléen 17, Jessheim';
  var OPPDATER_VAER_MIN = 20;
  var VAER_ENDEPUNKT = 'https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=' + VAER_LAT + '&lon=' + VAER_LON;

  var VAER_LABEL = {
    clearsky: 'Klarvær', fair: 'Lettskyet', partlycloudy: 'Delvis skyet', cloudy: 'Skyet',
    rainshowers: 'Regnbyger', rain: 'Regn', lightrain: 'Lett regn', heavyrain: 'Kraftig regn',
    lightrainshowers: 'Lette regnbyger', heavyrainshowers: 'Kraftige regnbyger',
    sleet: 'Sludd', sleetshowers: 'Sluddbyger',
    snow: 'Snø', lightsnow: 'Lett snø', heavysnow: 'Kraftig snøvær', snowshowers: 'Snøbyger',
    fog: 'Tåke', thunder: 'Torden'
  };
  function vaerLabel(code){
    var base = (code || '').replace('_day','').replace('_night','').replace('_polartwilight','');
    return VAER_LABEL[base] || 'Ukjent';
  }
  function vaerIkonSvg(code, storrelse){
    var c = code || '';
    var natt = c.indexOf('_night') !== -1;
    var felles = 'viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:' + storrelse + ';height:' + storrelse + '"';
    var sol = '<circle cx="50" cy="46" r="20" fill="#C9A467"/>';
    var mane = '<path d="M60 30a22 22 0 1 0 10 32A18 18 0 0 1 60 30Z" fill="#C9A467"/>';
    var himmellegeme = natt ? mane : sol;
    var sky = '<path d="M25 68a14 14 0 0 1 4-27 18 18 0 0 1 35-6 15 15 0 0 1 11 27 4 4 0 0 1 0 6H25a4 4 0 0 1 0-0Z" fill="#A7AEB6"/>';
    if(c.indexOf('clearsky') === 0){ return '<svg ' + felles + '>' + himmellegeme + '</svg>'; }
    if(c.indexOf('fair') === 0){ return '<svg ' + felles + '><g transform="translate(-8,-8) scale(0.85)">' + himmellegeme + '</g>' + sky + '</svg>'; }
    if(c.indexOf('partlycloudy') === 0){ return '<svg ' + felles + '><g transform="translate(-14,-12) scale(0.7)">' + himmellegeme + '</g>' + sky + '</svg>'; }
    if(c.indexOf('cloudy') === 0 || c.indexOf('fog') === 0){ return '<svg ' + felles + '>' + sky + '<path d="M25 68a14 14 0 0 1 4-27 18 18 0 0 1 35-6 15 15 0 0 1 11 27" fill="none" stroke="#A7AEB6" stroke-width="2"/></svg>'; }
    if(c.indexOf('rain') !== -1 || c.indexOf('sleet') !== -1){
      return '<svg ' + felles + '>' + sky + '<line x1="35" y1="76" x2="30" y2="90" stroke="#5B8A80" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="76" x2="45" y2="90" stroke="#5B8A80" stroke-width="4" stroke-linecap="round"/><line x1="65" y1="76" x2="60" y2="90" stroke="#5B8A80" stroke-width="4" stroke-linecap="round"/></svg>';
    }
    if(c.indexOf('snow') !== -1){
      return '<svg ' + felles + '>' + sky + '<circle cx="35" cy="82" r="3" fill="#F1EEE6"/><circle cx="50" cy="88" r="3" fill="#F1EEE6"/><circle cx="65" cy="82" r="3" fill="#F1EEE6"/></svg>';
    }
    if(c.indexOf('thunder') !== -1){
      return '<svg ' + felles + '>' + sky + '<path d="M48 74l-8 14h8l-4 10 14-16h-8l6-8Z" fill="#C9A467"/></svg>';
    }
    return '<svg ' + felles + '>' + sky + '</svg>';
  }

  function hentVaer(){
    fetch(VAER_ENDEPUNKT)
      .then(function(res){
        if(!res.ok) throw new Error('Værtjenesten svarte med feilkode ' + res.status);
        return res.json();
      })
      .then(function(json){
        var serie = get(json, 'properties.timeseries', null);
        if(!serie || serie.length === 0) throw new Error('Fant ingen værdata.');

        var naa = serie[0];
        var detaljer = get(naa, 'data.instant.details', {});
        var symbol = get(naa, 'data.next_1_hours.summary.symbol_code', null) || get(naa, 'data.next_6_hours.summary.symbol_code', null) || 'cloudy';
        var nedbor = get(naa, 'data.next_1_hours.details.precipitation_amount', undefined);

        document.getElementById('vaerSted').textContent = VAER_STED_NAVN;
        document.getElementById('vaerTemp').textContent = Math.round(detaljer.air_temperature) + '°';
        document.getElementById('vaerBeskrivelse').textContent = vaerLabel(symbol);
        document.getElementById('vaerIkon').innerHTML = vaerIkonSvg(symbol, '100%');

        var detaljTekst = 'Vind ' + detaljer.wind_speed.toFixed(0) + ' m/s';
        if(nedbor !== undefined && nedbor > 0) detaljTekst += ' · Nedbør ' + nedbor + ' mm';
        document.getElementById('vaerDetaljer').textContent = detaljTekst;

        var stripEl = document.getElementById('vaerStrip');
        var idxListe = [3, 6, 9, 12];
        var html = '';
        for(var i=0; i<idxListe.length; i++){
          var p = serie[idxListe[i]];
          if(!p) continue;
          var t = new Date(p.time);
          var sym = get(p, 'data.next_1_hours.summary.symbol_code', null) || get(p, 'data.next_6_hours.summary.symbol_code', null) || 'cloudy';
          html += ''
            + '<div class="vaer-time">'
            + '<span class="kl">' + t.toLocaleTimeString('nb-NO', { hour:'2-digit', minute:'2-digit' }) + '</span>'
            + vaerIkonSvg(sym, '100%')
            + '<span class="t">' + Math.round(p.data.instant.details.air_temperature) + '°</span>'
            + '</div>';
        }
        stripEl.innerHTML = html;
      })
      .catch(function(e){
        console.error('Klarte ikke hente værdata', e);
        document.getElementById('vaerBeskrivelse').innerHTML = '<span class="vaer-feil">Klarte ikke hente værdata: ' + e.message + '</span>';
      });
  }

  /* ============ Karusell ============ */
  var slideIndex = 0;
  var karuselTimer = null;

  function byggPrikker(){
    var slides = mainEl.querySelectorAll('.slide');
    prikkerEl.innerHTML = '';
    for(var i=0; i<slides.length; i++){
      var p = document.createElement('div');
      p.className = 'prikk';
      prikkerEl.appendChild(p);
    }
  }

  function visSlide(i){
    var slides = mainEl.querySelectorAll('.slide');
    var prikker = prikkerEl.querySelectorAll('.prikk');
    for(var j=0; j<slides.length; j++){
      if(j === i) slides[j].className = slides[j].className.replace(' aktiv','') + ' aktiv';
      else slides[j].className = slides[j].className.replace(' aktiv','');
    }
    for(var k=0; k<prikker.length; k++){
      if(k === i) prikker[k].className = 'prikk aktiv';
      else prikker[k].className = 'prikk';
    }
  }

  function nesteSlide(){
    var slides = mainEl.querySelectorAll('.slide');
    if(slides.length === 0) return;
    slideIndex = slideIndex % slides.length;
    visSlide(slideIndex);
    var varighet = parseFloat(slides[slideIndex].getAttribute('data-varighet')) || VIS_SEKUNDER_STANDARD;
    if(karuselTimer) clearTimeout(karuselTimer);
    karuselTimer = setTimeout(function(){
      slideIndex = (slideIndex + 1) % slides.length;
      nesteSlide();
    }, varighet * 1000);
  }

  function startKarusell(){
    slideIndex = 0;
    nesteSlide();
  }

  /* ============ Klokke ============ */
  function oppdaterKlokke(){
    var now = new Date();
    document.getElementById('klokke').textContent = now.toLocaleTimeString('nb-NO', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('dato').textContent = now.toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long' });
    if(now.getHours() === RELOAD_KL_TIME && now.getMinutes() === 0 && now.getSeconds() < 2){
      location.reload();
    }
  }

  /* ============ Oppstart ============ */
  hentMeldinger();
  hentAvganger();
  hentVaer();
  oppdaterKlokke();

  setInterval(oppdaterKlokke, 1000);
  setInterval(hentMeldinger, OPPDATER_DATA_MIN * 60 * 1000);
  setInterval(hentAvganger, OPPDATER_AVGANGER_SEK * 1000);
  setInterval(hentVaer, OPPDATER_VAER_MIN * 60 * 1000);
</script>

</body>
</html>
